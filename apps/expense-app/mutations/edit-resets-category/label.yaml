id: expense.edit-resets-category
app: expense-app
title: "Edit form does not preselect the category"
description: "The edit form's Category select has no option selected, so the browser shows the first one (travel); saving an edit without touching it silently changes the category."
track: regression
kind: defect
category: functional
class: deterministic
severity: major
difficulty: subtle
exposure: novel
where: { route: /expenses, role: editor }
switch:
  env: { DEFECT: edit_resets_category }
  exclusive: expense-update   # misleading_success skips the update, so this cannot show
found_by:
  - kind: value
    description_pattern: '^(?=[\s\S]*categor)(?=[\s\S]*(\bedit|re-?sav|updat\w* (an|the|a|its) (expense|amount|title)))(?=[\s\S]*(reset|revert|defaults? to|default (option|value|category)|by default|first (option|category|entry|value)|not (pre-?)?selected|is ?n.t (pre-?)?selected|unselected|nothing (is )?selected|no (option|category) (is )?(pre-?)?selected|blank|wrong categor|silently chang|chang\w* (it )?(silently|by itself|on its own|unexpectedly)|without (touching|changing|selecting)|(becomes?|became|changed? to|switch\w* to|set to|saved as|now|turns? into|flips? to|jumps? to)( \w+){0,2} .?travel|(select|dropdown|drop-down|field|menu)( \w+){0,3} (shows?|displays?|has|is (set to|on)) .?travel|chang\w* (its|the) categor|\blost\b|loses|not (kept|preserved|retained)|does ?n.t (keep|preserve|retain|remember|show)))'
    note: "After editing only the amount of a meals expense, it is listed as travel"
tolerance: { route: prefix }
split: public
upstream_ref: "apps/expense-app/app/src/server.ts (DEFECT=edit_resets_category); checked by apps/expense-app/verify.ts"
