    DEFECT: blank_title_accepted
found_by:
  - kind: behaviour
    description_pattern: ^(?=[\s\S]*(whitespace|only spaces|spaces.only))(?=[\s\S]*title)(?=[\s\S]*(accept|sav|persist|creat))
    note: Whitespace-only titles are accepted and saved as an empty title
tolerance:
  route: prefix
  role: any
split: public
upstream_ref: apps/expense-app/app/src/server.ts; checked by apps/expense-app/verify.ts
masks: [expense.rejected-form-loses-input]
