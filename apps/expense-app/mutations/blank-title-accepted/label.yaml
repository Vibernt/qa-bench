id: expense.blank-title-accepted
app: expense-app
title: Whitespace-only titles are accepted and saved as an empty title
description: Whitespace-only titles are accepted and saved as an empty title.
track: exploration
kind: defect
category: error-handling
class: deterministic
severity: major
difficulty: subtle
exposure: novel
where:
  route: /expenses
switch:
