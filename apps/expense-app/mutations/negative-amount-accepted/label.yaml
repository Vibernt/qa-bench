id: expense.negative-amount-accepted
app: expense-app
title: Negative amounts submitted through add and edit are saved
description: Negative amounts submitted through add and edit are saved.
track: exploration
kind: defect
category: error-handling
class: deterministic
severity: major
difficulty: subtle
exposure: novel
