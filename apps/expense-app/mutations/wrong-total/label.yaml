id: expense.wrong-total
app: expense-app
title: "Total omits the last row"
description: "The list total leaves out the last listed expense."
track: regression
kind: defect
category: consistency
class: deterministic
severity: major
where: { route: /expenses, role: viewer }
switch:
  env: { DEFECT: wrong_total }
  exclusive: expense-defect   # the app takes one DEFECT value at a time
found_by:
  - kind: value
    selector: "[data-testid=total]"
    note: "Total is not the sum of the listed amounts"
tolerance: { route: exact, role: any }
split: public
upstream_ref: "apps/expense-app/app/src/server.ts (DEFECT=wrong_total); checked by apps/expense-app/verify.ts"
