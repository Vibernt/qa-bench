id: expense.duplicate-write
app: expense-app
title: "One save writes two rows"
description: "Saving a new expense once inserts it twice."
track: regression
kind: defect
category: functional
class: deterministic
severity: critical
difficulty: blatant
exposure: novel
where: { route: /expenses, role: editor }
switch:
  env: { DEFECT: duplicate_write }
  exclusive: expense-create   # missing_persistence skips the insert, so duplicate_write cannot show
found_by:
  - kind: value
    description_pattern: 'twice|two (identical |duplicate |separate )?(rows|copies|entries|records|expenses|times|lines)|\b2 (identical )?(rows|copies|entries|records|lines)|duplicat|doubl(e|ed|es)\b|second (copy|row|entry)|by two (rows|entries)'
    note: "Two identical rows appear after one save"
  - kind: value
    category: consistency
    description_pattern: 'twice|two (identical |duplicate |separate )?(rows|copies|entries|records|expenses|times|lines)|\b2 (identical )?(rows|copies|entries|records|lines)|duplicat|doubl(e|ed|es)\b|second (copy|row|entry)|by two (rows|entries)'
    note: "Row count or total grows by two entries after one save"
tolerance: { route: prefix }
split: public
upstream_ref: "apps/expense-app/app/src/server.ts (DEFECT=duplicate_write); checked by apps/expense-app/verify.ts"
