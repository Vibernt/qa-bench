id: expense.legit-duplicate
app: expense-app
title: Distinct repeat purchases share a title and amount
description: Distinct repeat purchases share a title and amount. Reporting this seeded content as a problem is a false alarm.
track: exploration
kind: trap
category: functional
class: deterministic
severity: minor
difficulty: subtle
exposure: novel
where:
  route: /expenses
switch:
  env:
    TRAP: legit_duplicate
found_by:
  - kind: behaviour
    description_pattern: ^(?![\s\S]*(after (one |a )?sav|one click|single (sav|submit)|one sav|adding|add(ing)? one|submit|created? two|creates? (a )?duplicat|legitimate|distinct|correct))(?=[\s\S]*(rows?|expenses?|purchases?|weekly bus pass))(?=[\s\S]*(duplicat|repeat|twice|two identical|two matching))
    note: Distinct repeat purchases share a title and amount
tolerance:
  route: prefix
  role: any
split: public
upstream_ref: apps/expense-app/app/src/switches/traps.ts; checked by apps/expense-app/verify.ts
