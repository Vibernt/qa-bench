id: expense.silent-delete
app: expense-app
title: "Delete acts at once, with no confirmation and no message"
description: "Each row's Delete button removes the expense on one click, with no confirmation or undo, and the list then shows no message, although adding shows \"Expense saved\" and editing shows \"Expense updated\". Found by agents in the v0.2 sample runs; not planted."
track: regression
kind: natural
category: usability
class: deterministic
severity: minor
where: { route: /expenses, role: editor }
found_by:
  - kind: behaviour
    also_categories: [consistency, functional]
    description_pattern: '^(?=[\s\S]*(delet|remov))(?=[\s\S]*(no (confirm\w*|prompt|dialog|warning|undo)|without (any |a )?(confirm\w*|prompt|dialog|warning|asking)|(one|single) click|\bimmediately\b|are you sure|not (asked|prompted) to confirm))'
    note: "Delete removes the row at once, with no confirmation step"
  - kind: text
    also_categories: [consistency, functional]
    description_pattern: '^(?=[\s\S]*(delet|remov))(?=[\s\S]*(no( \w+){0,3} (message|feedback|flash|notice|toast|status)|without (any |a )?(\w+ )?(message|feedback|notice)|(delete|deleting|deletion) (shows|gives|displays) nothing|expense deleted))'
    note: "After a delete the list shows no message, unlike add and edit"
tolerance: { route: prefix, role: any }
split: public
upstream_ref: "apps/expense-app/app/src/server.ts (POST /expenses/:id/delete redirects to /expenses without a flash; the button has no confirm); checked by apps/expense-app/verify.ts"
