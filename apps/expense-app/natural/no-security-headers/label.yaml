id: expense.no-security-headers
app: expense-app
title: "Pages are served without hardening headers"
description: "HTML responses carry no Content-Security-Policy, X-Frame-Options (or frame-ancestors) or X-Content-Type-Options, so the signed-in pages can be framed (clickjacking). Found by agents in the v0.2 sample runs; not planted."
track: regression
kind: natural
category: security-hygiene
class: deterministic
severity: minor
where: { route: "*" }
found_by:
  - kind: status
    description_pattern: 'content-security-policy|\bcsp\b|x-frame-options|frame-ancestors|x-content-type-options|nosniff|clickjack|(security|hardening) headers?'
    note: "No CSP, X-Frame-Options or X-Content-Type-Options on HTML responses"
tolerance: { route: prefix, role: any }
split: public
upstream_ref: "apps/expense-app/app/src/server.ts (sendHtml sets only content-type and cache-control); checked by apps/expense-app/verify.ts"
