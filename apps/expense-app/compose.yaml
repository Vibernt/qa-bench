# Expense app. A fresh container is a fresh seed (bench-entry.mjs); there are no volumes.
services:
  app:
    image: qa-bench-app-expense-app:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEFECT: ${DEFECT:-}
      VARIANT: ${VARIANT:-}
      QA_BENCH_VIEWER_ACCOUNTS: ${QA_BENCH_VIEWER_ACCOUNTS:-}
      QA_BENCH_EDITOR_ACCOUNTS: ${QA_BENCH_EDITOR_ACCOUNTS:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
