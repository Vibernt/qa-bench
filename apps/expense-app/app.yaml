# Expense app (ours, apps/expense-app/app). bench-entry.mjs seeds a fresh database at every container start and
# swaps the seed logins for the episode's generated accounts.
app: expense-app
title: Expense app (two roles, SQLite, deterministic reset)
purpose: "An expense tracker for a small team: viewers read the expenses and their total, editors also add and edit them."
label_prefix: expense
targets:
  - name: expense-app
    service: app
    port: 3000
    path: /expenses
    health_path: /login
roles:
  - role: viewer
    accounts: 1
    username_prefix: viewer
    env: QA_BENCH_VIEWER_ACCOUNTS
  - role: editor
    accounts: 1
    username_prefix: editor
    env: QA_BENCH_EDITOR_ACCOUNTS
journeys:
  - id: expense.list
    title: View the expense list and its total
    role: viewer
    start: /expenses
    steps:
      - Sign in as the viewer
      - Open the expense list
      - Check that the total equals the sum of the listed amounts
  - id: expense.filter
    title: Filter expenses by category
    role: viewer
    start: /expenses
    steps:
      - Sign in as the viewer
      - Choose a category in the filter
      - Check that only expenses of that category are listed
  - id: expense.add
    title: Add an expense
    role: editor
    start: /expenses
    steps:
      - Sign in as the editor
      - Choose "Add expense", fill in title, amount and category, and save
      - Check the success message, that exactly one new row appears in the list, and that it is still there after a reload
  - id: expense.edit
    title: Edit an expense
    role: editor
    start: /expenses
    steps:
      - Sign in as the editor
      - Open an expense, change its amount and save
      - Check that the list and the total show the new amount straight away
  - id: expense.viewer-readonly
    title: Viewer cannot edit
    role: viewer
    start: /expenses
    steps:
      - Sign in as the viewer
      - Check that no edit or add controls are offered and that a direct edit request is refused
pages: [/expenses]
