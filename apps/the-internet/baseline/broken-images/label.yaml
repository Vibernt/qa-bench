  - kind: visual
    selector: "img[src=hjkl.jpg]"
    note: "Second image is broken"
  - kind: network
    category: error-handling
    note: "GET /asdf.jpg and /hjkl.jpg return 404; 'Failed to load resource' in the console"
  - kind: network
    category: functional
    note: "Images fail to load"
split: public
upstream_ref: "views/broken_images.erb (saucelabs/the-internet); checked by apps/the-internet/verify.ts"
