id: swag.blank-not-found-page
app: swag-labs
title: "An unknown URL shows a blank page"
description: "Any path the app doesn't know (for example /nonexistent) answers 404 but renders an empty page: no message, no navigation, no way back. The app has no catch-all route. Upstream behaviour, found by an agent in the v0.2 sample runs; not planted."
track: regression
kind: natural
category: error-handling
class: deterministic
severity: minor
where: { route: "*" }
found_by:
  - kind: element
    also_categories: [usability, visual]
    description_pattern: '^(?![\s\S]*(inventory-item|item page|product page|id=\d|unknown (product|item)))(?=[\s\S]*((unknown|non-?existent|invalid|bad|missing|wrong|random|mistyped|undefined) (url|path|route|page|address)s?|/nonexistent|/no-such|\b404\b))(?=[\s\S]*(blank|empty|white|nothing|no (404|error|message|content|navigation)))'
    note: "/nonexistent renders an empty page with no error message"
tolerance: { route: any, role: any }
split: public
upstream_ref: "apps/swag-labs/upstream/src/index.jsx (no catch-all route); checked by apps/swag-labs/verify.ts"
