id: swag.unrounded-item-total
app: swag-labs
title: "Checkout item total can show an unrounded float"
description: "On the clean build the overview's item total is printed without rounding, e.g. 'Item total: $59.980000000000004' for Sauce Labs Bike Light + Sauce Labs Fleece Jacket. Upstream behaviour, found by an agent in the B0 sample runs; not planted."
track: regression
kind: natural
category: copy
class: deterministic
severity: minor
where: { route: /checkout-step-two.html, role: customer }
found_by:
  - kind: value
    also_categories: [consistency, visual]
    description_pattern: "(\\d\\.\\d{5,}|float|unrounded|not rounded|rounding|decimal places|precision)"
    selector: "[data-test=subtotal-label]"
    note: "Item total shows a long floating-point tail instead of two decimals"
tolerance: { route: exact, role: any }
split: public
masked_by: [swag.error-user, swag.locked-out-user, swag.problem-user]
upstream_ref: "apps/swag-labs/upstream/src/pages/CheckOutStepTwo.jsx (item total rendered without toFixed); checked by apps/swag-labs/verify.ts"
