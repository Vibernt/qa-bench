id: swag.no-security-headers
app: swag-labs
title: "Pages are served without hardening headers"
description: "The bench's nginx serves the app with no Content-Security-Policy, X-Frame-Options (or frame-ancestors) or X-Content-Type-Options, so it can be framed. Found by an agent in the v0.2 sample runs; not planted."
track: regression
kind: natural
category: security-hygiene
class: deterministic
severity: minor
where: { route: "*" }
found_by:
  - kind: status
    description_pattern: 'content-security-policy|\bcsp\b|x-frame-options|frame-ancestors|x-content-type-options|nosniff|clickjack|(security|hardening) headers?'
    note: "No CSP, X-Frame-Options or X-Content-Type-Options on the HTML responses"
tolerance: { route: prefix, role: any }
split: public
upstream_ref: "apps/swag-labs/bench/nginx.conf (adds no security headers); checked by apps/swag-labs/verify.ts"
