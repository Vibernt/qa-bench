id: swag.empty-cart-checkout
app: swag-labs
title: "An order can be placed with an empty cart"
description: "With nothing in the cart, Checkout still opens the information step, the overview shows a $0.00 total, and Finish shows the order-complete page. Upstream behaviour, found by an agent in the v0.2 sample runs; not planted."
track: regression
kind: natural
category: functional
class: deterministic
severity: minor
where: { route: /cart.html, role: customer }
found_by:
  - kind: behaviour
    also_categories: [error-handling]
    description_pattern: '^(?=[\s\S]*(empty cart|cart (is )?empty|no items|zero items|0 items|without (any )?(items|products|an order|any order)|nothing in the cart))(?=[\s\S]*(checkout|check out|order|finish))'
    note: "Checkout with an empty cart goes through to the order-complete page"
tolerance: { route: any, role: any }
split: public
upstream_ref: "apps/swag-labs/upstream/src/pages/Cart.jsx (the Checkout button is always enabled); checked by apps/swag-labs/verify.ts"
