# QA-BENCH: serves the built Swag Labs SPA. The app's own routes (/inventory.html, /cart.html, ...) are served from
# index.html with 200. Any other path gets the same page with a 404 status, as upstream's GitHub Pages deployment does
# (its 404.html hands the path to the app); without this, unknown URLs answered 200, a defect of the bench, not the app.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Written at container start from the episode's env; never cached.
    location = /runtime-config.js {
        add_header Cache-Control "no-store";
    }

    # The app's error reporter (Backtrace) posts here instead of to a third party.
    location = /backtrace/submit {
        return 204;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location ~ ^/(inventory|inventory-long|inventory-item|cart|checkout-step-one|checkout-step-two|checkout-complete|dynamic-catalog-lazy-load|dynamic-catalog-spinner|dynamic-catalog-slider)\.html$ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
        error_page 404 /index.html;
    }
}
