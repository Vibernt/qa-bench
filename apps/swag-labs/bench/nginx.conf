# QA-BENCH: serves the built Swag Labs SPA. Every app route (/inventory.html, /cart.html, ...) falls back to
# index.html, as upstream's GitHub Pages 404 redirect did.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Written at container start from the episode's env; never cached.
    location = /runtime-config.js {
        add_header Cache-Control "no-store";
    }

    # The app's error reporter (Backtrace) posts here instead of to a third party.
    location = /backtrace/submit {
        return 204;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
