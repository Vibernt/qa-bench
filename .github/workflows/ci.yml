name: ci
on:
  # Pull requests run on their own trigger; pushes are checked only on main, so a PR branch isn't checked twice.
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and typecheck
        run: npm run lint
      - name: Validate every YAML and JSON contract in the repo
        run: npm run validate
      - name: Unit tests (no live apps, no browsers)
        run: npm test
